services:
  - type: web
    name: hotshot-v3
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: hotshot-db
          property: connectionString
      - key: PGSSL
        value: "true"
      - key: ODDS_API_KEY
        sync: false

databases:
  - name: hotshot-db
    databaseName: hotshot
    user: hotshot
